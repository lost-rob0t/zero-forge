[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-forge"
version = "0.1.0"
description = "LLM-based exploit-development harness for security artifact generation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langgraph>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.9",
    "litellm>=1.0; python_version<'3.14'",
    "litellm<1.99; python_version>='3.14'",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
zero-forge = "zero_forge.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["zero_forge*"]
exclude = [
    "tests*",
    "wiki*",
    "research*",
    "dev_scripts*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"zero_forge/tools/validator.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.setuptools.package-data]
zero_forge = [
    "llm_examples/metasploit/*.rb",
    "llm_examples/zap/active/*.js",
    "llm_examples/zap/passive/*.js",
]
