name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint with ruff
        run: |
          set -o pipefail
          uv run ruff check . 2>&1 | tee ruff.log

      - name: Upload Ruff diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ruff-diagnostics-pr-132
          path: ruff.log

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Type-check with mypy
        run: uv run mypy zero_forge

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest --cov=zero_forge --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  py314-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"

      - name: Install package with locked dependencies
        run: uv sync --locked --extra dev

      - name: Verify litellm version is below 1.92
        run: |
          uv run python -c "from importlib.metadata import version; v = version('litellm'); assert v < '1.92', f'Expected litellm < 1.92 on Python 3.14, got {v}'"
          echo "litellm version: $(uv run python -c 'from importlib.metadata import version; print(version("litellm"))')"

      - name: Smoke import
        run: uv run python -c "import zero_forge; print('zero_forge imported successfully')"
