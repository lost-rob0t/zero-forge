name: PR 118 Diagnostics

on:
  push:
    branches:
      - agent/discovery-specification-loop
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --locked --extra dev
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          uv run pytest tests/ -x -vv > pytest.txt 2>&1
          echo "pytest_exit=$?" > exits.txt
          uv run mypy zero_forge > mypy.txt 2>&1
          echo "mypy_exit=$?" >> exits.txt
          uv run ruff check . > ruff.txt 2>&1
          echo "ruff_exit=$?" >> exits.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr118-diagnostics
          path: |
            pytest.txt
            mypy.txt
            ruff.txt
            exits.txt
          if-no-files-found: error
