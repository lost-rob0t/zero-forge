name: Code review finding
description: Track one concrete defect discovered during review
title: "[Review]: "
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. Include evidence, impact, a direct fix path, and regression validation.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker
        - High
        - Medium
        - Low
        - Nit
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: File, symbol, node, endpoint, or line range.
      placeholder: zero_forge/output.py::_safe_resolve
    validations:
      required: true

  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: State the defect directly.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Show the relevant code path, failing input, trace, test, or state transition.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain what can break, escape validation, corrupt state, or produce incorrect artifacts.
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Required fix
      description: Give implementation guidance without expanding the task beyond this defect.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define the expected behavior after the fix.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Regression tests
      description: Name the tests to add or update and the commands that must pass before commit.
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Fix branch
      placeholder: fix/zf-###
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Review checks
      options:
        - label: This issue covers exactly one independently fixable problem.
          required: true
        - label: The finding is supported by repository evidence.
          required: true
        - label: The proposed validation would fail before the fix and pass after it.
          required: true
