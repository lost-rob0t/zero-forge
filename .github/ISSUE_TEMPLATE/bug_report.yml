name: Bug report
description: Report reproducible incorrect behavior in ZeroForge
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Report one bug per issue. Remove secrets, API keys, private targets, and unrelated logs.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State the failure in one or two sentences.
      placeholder: The workflow marks an invalid artifact as successfully validated.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - LangGraph orchestration
        - Smart Agent
        - Tool Agent
        - Tool registry
        - Artifact generation
        - Validation and repair
        - Output and JSONL event log
        - CLI or API
        - Container or runtime
        - Configuration
        - Other
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: Describe exactly what happened, including the final state or output.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe the correct result.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest deterministic sequence that reproduces the bug.
      placeholder: |
        1. Run ...
        2. Supply ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Paste relevant logs, stack traces, generated artifact excerpts, or event IDs.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include commit, branch, Python version, execution mode, model provider, and container/runtime details.
      placeholder: |
        Commit:
        Branch:
        Python:
        Mode:
        Model/provider:
        Runtime:
    validations:
      required: true

  - type: textarea
    id: suspected_cause
    attributes:
      label: Suspected cause
      description: Optional. Point to likely files, functions, nodes, or state transitions.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define how the fix can be proven complete.
      placeholder: |
        - Regression test reproduces the old failure
        - Test passes after the fix
        - Existing tests remain green
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This issue contains one independently fixable bug.
          required: true
        - label: I removed credentials, private target data, and other secrets.
          required: true
