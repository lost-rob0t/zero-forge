name: Feature request
description: Propose a new ZeroForge capability or workflow change
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Define the problem and observable outcome. Keep implementation preferences separate from hard requirements.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete limitation or missing capability needs to be addressed?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what a user or agent must be able to do when this is complete.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent architecture
        - LangGraph workflow
        - Research and context collection
        - Metasploit generation
        - ZAP rule generation
        - Binary exploitation workflow
        - Validation and repair
        - Artifact IR or schemas
        - Tool registry
        - CLI or API
        - Storage or event logging
        - Isolation or execution runtime
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Functional requirements
      description: List behavior that is mandatory.
      placeholder: |
        - The system must ...
        - The Smart Agent must ...
        - The Tool Agent must not ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: State what this issue deliberately does not include.

  - type: textarea
    id: design
    attributes:
      label: Proposed design
      description: Optional implementation direction, data flow, interfaces, or state changes.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use objectively testable completion conditions.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Specify unit, integration, runtime, fixture, or benchmark checks.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Link related issues, branches, specifications, or blockers.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and specifications for overlap.
          required: true
        - label: The request preserves the Smart Agent / Tool Agent responsibility boundary.
          required: true
        - label: The acceptance criteria are testable.
          required: true
