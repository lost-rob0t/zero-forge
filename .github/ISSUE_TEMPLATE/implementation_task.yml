name: Implementation task
description: Define one branch-sized implementation task for an agent or developer
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        This form is intended to be executable by Agent Zero or a developer without reconstructing missing requirements.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the single result this task must produce.
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Required branch
      description: Name the branch to create or use before editing.
      placeholder: fix/zf-###
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Link the parent issue, review finding, specification, failing test, or relevant evidence.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: List the exact behavior and files or modules that may change.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Out of scope
      description: List adjacent work that must not be included.
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation requirements
      description: Give precise rules, invariants, interfaces, and failure behavior.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Each item must be independently verifiable.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Required validation
      description: List exact commands and expected results. Commits are allowed only after these pass.
      placeholder: |
        pytest ...
        ruff check ...
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: Expected artifacts
      description: Name code, tests, fixtures, documentation, migrations, or event-log changes that must be produced.

  - type: textarea
    id: handoff
    attributes:
      label: Handoff notes
      description: State what the next task may assume after this issue is complete.

  - type: checkboxes
    id: done
    attributes:
      label: Definition of done
      options:
        - label: Work begins on the required branch.
          required: true
        - label: Only this issue's scope is changed.
          required: true
        - label: New behavior has regression coverage.
          required: true
        - label: Relevant tests must pass before commit.
          required: true
        - label: Tool calls, model decisions, retries, and outputs remain represented in the JSONL event log where applicable.
          required: true
